; Supervisor: keeps the Laravel queue worker running (push, WhatsApp, receipts, digests).
; Install: copy to /etc/supervisor/conf.d/abmm-worker.conf, edit the paths/user, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start abmm-worker:*
[program:abmm-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/abmm/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/abmm
user=www-data
numprocs=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/abmm/storage/logs/worker.log
